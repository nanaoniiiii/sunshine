org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Robolectric's test-only crypto jars contain newer multi-release bytecode and
# no Android Support references; they must not be rewritten by Jetifier.
android.jetifier.ignorelist=bcprov-jdk18on,bcutil-jdk18on,bctls-jdk18on
kotlin.daemon.jvm.options=-Xmx1024m
