name: Sync release APKs to official site

on:
  release:
    types: [published, unpublished, deleted]
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to synchronize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: official-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Copy verified release packages and publish the official manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OFFICIAL_RELEASE_SYNC_SECRET: ${{ secrets.OFFICIAL_RELEASE_SYNC_SECRET }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 tools/push_official_release.py
